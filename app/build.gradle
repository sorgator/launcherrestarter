plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hmdm.emuilauncherrestarter'
    compileSdk 35
    defaultConfig {
        applicationId "com.hmdm.emuilauncherrestarter"
        minSdk 21
        targetSdk 35
        versionCode 5
        versionName "1.05-suntel.1"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    lint {
        abortOnError true
        warningsAsErrors true
        // Fleet baseline is pinned and tested; dependency freshness is reviewed separately.
        disable 'OldTargetApi', 'GradleDependency', 'AndroidGradlePluginVersion'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
